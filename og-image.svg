<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>* { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }</style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#03060d"/>
      <stop offset="50%"  stop-color="#060f1d"/>
      <stop offset="100%" stop-color="#071525"/>
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>

    <radialGradient id="glowR" cx="82%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="halo"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="haloSm"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
    <circle cx="21" cy="21" r="0.65" fill="#3b82f6" opacity="0.09"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Logo -->
  <g transform="translate(90, 90)">
    <polygon points="30,2 56,17 56,47 30,62 4,47 4,17"
             fill="none" stroke="url(#brand)" stroke-width="1.8" opacity="0.9"/>
    <polygon points="30,9 50,21 50,43 30,55 10,43 10,21"
             fill="#03060d"/>
    <text x="30" y="43" text-anchor="middle" font-size="20"
          font-weight="900" fill="url(#brand)">H</text>
  </g>
  <text x="152" y="132" font-size="22" font-weight="800" letter-spacing="5" fill="#f1f5f9">HEXURA</text>
  <text x="316" y="132" font-size="22" font-weight="300" letter-spacing="5" fill="url(#brand)">TECH</text>

  <!-- Headline -->
  <text x="90" y="270" font-size="58" font-weight="900"
        letter-spacing="-1.5" fill="url(#headGrad)" filter="url(#textGlow)">AI-Powered</text>
  <text x="90" y="340" font-size="58" font-weight="900"
        letter-spacing="-1.5" fill="url(#headGrad)">Technology Solutions</text>

  <!-- Services line -->
  <text x="92" y="390" font-size="19" font-weight="400" fill="#64748b" letter-spacing="0.3">
    AI Agents  ·  Automation  ·  Software Development  ·  Cloud
  </text>

  <!-- Tagline -->
  <text x="92" y="430" font-size="14" font-weight="600"
        letter-spacing="1.8" fill="url(#brand)" opacity="0.75">
    BUILD FASTER.  AUTOMATE SMARTER.  SCALE CONFIDENTLY.
  </text>

  <!-- Node constellation, right side -->
  <g stroke="#1e3a8a" stroke-width="1" fill="none" opacity="0.5">
    <line x1="880" y1="130" x2="990" y2="105"/>
    <line x1="990" y1="105" x2="1080" y2="150"/>
    <line x1="880" y1="130" x2="940" y2="240"/>
    <line x1="990" y1="105" x2="940" y2="240"/>
    <line x1="1080" y1="150" x2="940" y2="240"/>
    <line x1="940" y1="240" x2="870" y2="340"/>
    <line x1="940" y1="240" x2="1060" y2="330"/>
    <line x1="1080" y1="150" x2="1060" y2="330"/>
    <line x1="870" y1="340" x2="1060" y2="330"/>
  </g>
  <g stroke="url(#brand)" stroke-width="1.3" fill="none" opacity="0.28">
    <line x1="990" y1="105" x2="940" y2="240"/>
    <line x1="940" y1="240" x2="870" y2="340"/>
    <line x1="940" y1="240" x2="1060" y2="330"/>
  </g>

  <circle cx="940" cy="240" r="55" fill="url(#coreHalo)" filter="url(#halo)"/>
  <circle cx="990" cy="105" r="22" fill="url(#nodeHalo)" filter="url(#haloSm)"/>
  <circle cx="870" cy="340" r="20" fill="url(#nodeHalo)" filter="url(#haloSm)"/>
  <circle cx="1060" cy="330" r="20" fill="url(#nodeHalo)" filter="url(#haloSm)"/>

  <circle cx="880" cy="130" r="5.5" fill="#3b82f6" opacity="0.75"/>
  <circle cx="1080" cy="150" r="5.5" fill="#06b6d4" opacity="0.75"/>

  <circle cx="990" cy="105" r="9" fill="#03060d"/>
  <circle cx="990" cy="105" r="9" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <circle cx="990" cy="105" r="4" fill="#06b6d4" opacity="0.95"/>

  <circle cx="870" cy="340" r="9" fill="#03060d"/>
  <circle cx="870" cy="340" r="9" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <circle cx="870" cy="340" r="4" fill="#06b6d4" opacity="0.95"/>

  <circle cx="1060" cy="330" r="9" fill="#03060d"/>
  <circle cx="1060" cy="330" r="9" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <circle cx="1060" cy="330" r="4" fill="#3b82f6" opacity="0.95"/>

  <circle cx="940" cy="240" r="20" fill="#03060d"/>
  <circle cx="940" cy="240" r="20" fill="none" stroke="url(#brand)" stroke-width="2.2"/>
  <circle cx="940" cy="240" r="9" fill="url(#brand)" opacity="0.95"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="623" width="1200" height="7" fill="url(#brand)" opacity="0.6"/>
</svg>
