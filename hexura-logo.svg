<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Hexagon outer ring -->
  <polygon points="40,4 68,20 68,52 40,68 12,52 12,20"
           fill="none" stroke="url(#brand)" stroke-width="2.5"/>
  <!-- Hexagon inner -->
  <polygon points="40,12 60,24 60,48 40,60 20,48 20,24"
           fill="#0B1220"/>
  <!-- H letterform -->
  <text x="40" y="46" text-anchor="middle" font-size="28"
        font-weight="900" fill="url(#brand)"
        font-family="Inter, Helvetica Neue, Arial, sans-serif">H</text>

  <!-- HEXURA -->
  <text x="88" y="38" font-size="26" font-weight="800"
        letter-spacing="5" fill="#F8FAFC"
        font-family="Inter, Helvetica Neue, Arial, sans-serif">HEXURA</text>

  <!-- TECH -->
  <text x="88" y="62" font-size="14" font-weight="300"
        letter-spacing="8" fill="url(#brand)"
        font-family="Inter, Helvetica Neue, Arial, sans-serif">TECH</text>
</svg>
