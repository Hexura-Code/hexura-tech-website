<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 160" width="1600" height="160">
  <defs>
    <style>* { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }</style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#03060d"/>
      <stop offset="50%"  stop-color="#060f1d"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="halo"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="haloSm"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="160" fill="url(#bg)"/>
  <rect width="1600" height="160" fill="url(#centerGlow)"/>

  <!-- Dot grid -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.55" fill="#3b82f6" opacity="0.08"/>
  </pattern>
  <rect width="1600" height="160" fill="url(#dots)"/>

  <!-- ══════════════════════════════════
       BACKGROUND CONSTELLATION
       Very subtle — full width, behind text
  ══════════════════════════════════ -->
  <g opacity="0.18" stroke="#1e3a8a" stroke-width="0.8" fill="none">
    <line x1="80"  y1="30"  x2="220" y2="55"/>
    <line x1="220" y1="55"  x2="160" y2="120"/>
    <line x1="80"  y1="30"  x2="160" y2="120"/>
    <line x1="1380" y1="25"  x2="1500" y2="60"/>
    <line x1="1500" y1="60"  x2="1460" y2="130"/>
    <line x1="1380" y1="25"  x2="1460" y2="130"/>
    <line x1="1300" y1="80"  x2="1380" y2="25"/>
    <line x1="1300" y1="80"  x2="1460" y2="130"/>
    <line x1="120"  y1="90"  x2="220" y2="55"/>
    <line x1="120"  y1="90"  x2="160" y2="120"/>
  </g>
  <!-- Background node dots -->
  <g opacity="0.3" fill="#3b82f6">
    <circle cx="80"   cy="30"  r="2.5"/>
    <circle cx="220"  cy="55"  r="2.5"/>
    <circle cx="160"  cy="120" r="2.5"/>
    <circle cx="120"  cy="90"  r="2"/>
    <circle cx="1300" cy="80"  r="3"/>
    <circle cx="1380" cy="25"  r="2.5"/>
    <circle cx="1500" cy="60"  r="2"/>
    <circle cx="1460" cy="130" r="2.5"/>
  </g>

  <!-- ══════════════════════════════════
       ALL TEXT — HORIZONTALLY CENTRED
       cx = 800 (centre of 1600px canvas)
  ══════════════════════════════════ -->

  <!-- Row 1: Logo + company name  y=38 -->
  <!-- Hex mark centred -->
  <polygon points="756,22 770,14 784,22 784,38 770,46 756,38"
           fill="none" stroke="url(#brand)" stroke-width="1.4" opacity="0.9"/>
  <text x="770" y="37" text-anchor="middle" font-size="13"
        font-weight="900" fill="url(#brand)">H</text>

  <text x="793" y="38" font-size="15" font-weight="800" letter-spacing="4" fill="#f1f5f9">HEXURA</text>
  <text x="899" y="38" font-size="15" font-weight="300" letter-spacing="4" fill="url(#brand)">TECH</text>

  <!-- Row 2: Headline  y=83 — CENTRED -->
  <text x="800" y="83" text-anchor="middle"
        font-size="38" font-weight="900" letter-spacing="-1"
        fill="white" filter="url(#textGlow)">AI-Powered Technology Solutions</text>

  <!-- Row 3: Services  y=107 — CENTRED -->
  <text x="800" y="107" text-anchor="middle"
        font-size="14" font-weight="400" fill="#475569">
    AI Agents  ·  Automation  ·  Software Development  ·  Cloud Solutions
  </text>

  <!-- Row 4: Tagline  y=130 — CENTRED -->
  <text x="800" y="130" text-anchor="middle"
        font-size="11.5" font-weight="600" letter-spacing="1.5"
        fill="url(#brand)" opacity="0.70">
    BUILD FASTER  ·  AUTOMATE SMARTER  ·  SCALE CONFIDENTLY
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="155" width="1600" height="5" fill="url(#brand)" opacity="0.55"/>

</svg>
