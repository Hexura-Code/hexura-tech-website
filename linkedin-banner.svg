<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <style>* { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }</style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#03060d"/>
      <stop offset="50%"  stop-color="#060f1d"/>
      <stop offset="100%"  stop-color="#071525"/>
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>

    <linearGradient id="divV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowL" cx="30%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowR" cx="85%" cy="45%" r="40%">
      <stop offset="0%"   stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="halo"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="haloSm"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glowL)"/>
  <rect width="1584" height="396" fill="url(#glowR)"/>

  <!-- Dot grid -->
  <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
    <circle cx="22" cy="22" r="0.65" fill="#3b82f6" opacity="0.09"/>
  </pattern>
  <rect width="1584" height="396" fill="url(#dots)"/>

  <!-- ══════════════════════════════════════════
       BACKGROUND CONSTELLATION (full width, subtle)
  ══════════════════════════════════════════ -->
  <g opacity="0.12" stroke="#3b82f6" stroke-width="0.8" fill="none">
    <line x1="60"   y1="60"  x2="200" y2="110"/>
    <line x1="200"  y1="110" x2="140" y2="240"/>
    <line x1="60"   y1="60"  x2="140" y2="240"/>
    <line x1="60"   y1="60"  x2="120" y2="320"/>
    <line x1="140"  y1="240" x2="120" y2="320"/>
    <line x1="1400" y1="50"  x2="1520" y2="110"/>
    <line x1="1520" y1="110" x2="1480" y2="240"/>
    <line x1="1400" y1="50"  x2="1480" y2="240"/>
    <line x1="1480" y1="240" x2="1540" y2="330"/>
    <line x1="1300" y1="130" x2="1400" y2="50"/>
    <line x1="1300" y1="130" x2="1480" y2="240"/>
  </g>
  <g opacity="0.22" fill="#3b82f6">
    <circle cx="60"   cy="60"  r="2.5"/>
    <circle cx="200"  cy="110" r="2"/>
    <circle cx="140"  cy="240" r="2.5"/>
    <circle cx="120"  cy="320" r="2"/>
    <circle cx="1300" cy="130" r="3"/>
    <circle cx="1400" cy="50"  r="2.5"/>
    <circle cx="1520" cy="110" r="2"/>
    <circle cx="1480" cy="240" r="2.5"/>
    <circle cx="1540" cy="330" r="2"/>
  </g>

  <!-- ══════════════════════════════════════════
       LEFT TEXT BLOCK  (x: 120 – 840)
       Safe zone: avoid bottom-left (profile pic ~200x200)
  ══════════════════════════════════════════ -->

  <!-- Logo + name  y=108 -->
  <g transform="translate(120, 80)">
    <polygon points="30,2 56,17 56,47 30,62 4,47 4,17"
             fill="none" stroke="url(#brand)" stroke-width="1.8" opacity="0.9"/>
    <polygon points="30,9 50,21 50,43 30,55 10,43 10,21"
             fill="#03060d"/>
    <text x="30" y="43" text-anchor="middle" font-size="20"
          font-weight="900" fill="url(#brand)">H</text>
  </g>
  <text x="192" y="122" font-size="20" font-weight="800" letter-spacing="5" fill="#f1f5f9">HEXURA</text>
  <text x="356" y="122" font-size="20" font-weight="300" letter-spacing="5" fill="url(#brand)">TECH</text>

  <!-- Thin rule under logo -->
  <rect x="120" y="134" width="200" height="1.2" fill="url(#brand)" rx="1" opacity="0.4"/>

  <!-- Headline  y=210 -->
  <text x="120" y="210" font-size="64" font-weight="900"
        letter-spacing="-2" fill="url(#headGrad)" filter="url(#textGlow)">AI-Powered</text>
  <text x="120" y="285" font-size="64" font-weight="900"
        letter-spacing="-2" fill="url(#headGrad)">Technology Solutions</text>

  <!-- Services line -->
  <text x="122" y="325" font-size="18" font-weight="400" fill="#475569" letter-spacing="0.3">
    AI Agents  ·  Automation  ·  Software Development  ·  Cloud Solutions
  </text>

  <!-- Tagline -->
  <text x="122" y="362" font-size="13.5" font-weight="600"
        letter-spacing="1.8" fill="url(#brand)" opacity="0.72">
    BUILD FASTER.  AUTOMATE SMARTER.  SCALE CONFIDENTLY.
  </text>

  <!-- ── VERTICAL DIVIDER ── -->
  <rect x="970" y="0" width="1" height="396" fill="url(#divV)"/>

  <!-- ══════════════════════════════════════════
       RIGHT — NODE CONSTELLATION  (x: 990–1560)
       One clean illustration, generous spacing
  ══════════════════════════════════════════ -->

  <!--
    Nodes:
    A  1080, 68    small
    B  1240, 46    ring
    C  1420, 80    small
    D  1540, 160   tiny
    E  1180, 200   MAIN
    F  1360, 210   ring
    G  1060, 300   ring
    H  1280, 320   small
    I  1480, 310   tiny
  -->

  <!-- Faint connections -->
  <g stroke="#1e3a8a" stroke-width="1" fill="none" opacity="0.5">
    <line x1="1080" y1="68"  x2="1240" y2="46"/>
    <line x1="1240" y1="46"  x2="1420" y2="80"/>
    <line x1="1420" y1="80"  x2="1540" y2="160"/>
    <line x1="1080" y1="68"  x2="1180" y2="200"/>
    <line x1="1240" y1="46"  x2="1180" y2="200"/>
    <line x1="1420" y1="80"  x2="1180" y2="200"/>
    <line x1="1420" y1="80"  x2="1360" y2="210"/>
    <line x1="1540" y1="160" x2="1360" y2="210"/>
    <line x1="1180" y1="200" x2="1060" y2="300"/>
    <line x1="1180" y1="200" x2="1360" y2="210"/>
    <line x1="1180" y1="200" x2="1280" y2="320"/>
    <line x1="1360" y1="210" x2="1480" y2="310"/>
    <line x1="1360" y1="210" x2="1280" y2="320"/>
    <line x1="1060" y1="300" x2="1280" y2="320"/>
    <line x1="1280" y1="320" x2="1480" y2="310"/>
  </g>

  <!-- Active path connections -->
  <g stroke="url(#brand)" stroke-width="1.3" fill="none" opacity="0.26">
    <line x1="1240" y1="46"  x2="1180" y2="200"/>
    <line x1="1420" y1="80"  x2="1180" y2="200"/>
    <line x1="1180" y1="200" x2="1060" y2="300"/>
    <line x1="1180" y1="200" x2="1360" y2="210"/>
    <line x1="1180" y1="200" x2="1280" y2="320"/>
    <line x1="1360" y1="210" x2="1280" y2="320"/>
  </g>

  <!-- Halos -->
  <circle cx="1180" cy="200" r="65" fill="url(#coreHalo)" filter="url(#halo)"/>
  <circle cx="1180" cy="200" r="35" fill="#3b82f6" opacity="0.07" filter="url(#haloSm)"/>
  <circle cx="1240" cy="46"  r="22" fill="url(#nodeHalo)" filter="url(#haloSm)"/>
  <circle cx="1360" cy="210" r="20" fill="url(#nodeHalo)" filter="url(#haloSm)"/>
  <circle cx="1060" cy="300" r="20" fill="url(#nodeHalo)" filter="url(#haloSm)"/>

  <!-- Tiny nodes -->
  <circle cx="1540" cy="160" r="3.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="1480" cy="310" r="3.5" fill="#06b6d4" opacity="0.5"/>

  <!-- Small nodes -->
  <circle cx="1080" cy="68"  r="5.5" fill="#3b82f6" opacity="0.75"/>
  <circle cx="1420" cy="80"  r="5.5" fill="#06b6d4" opacity="0.75"/>
  <circle cx="1280" cy="320" r="5.5" fill="#3b82f6" opacity="0.70"/>

  <!-- Ring nodes -->
  <circle cx="1240" cy="46"  r="9"   fill="#03060d"/>
  <circle cx="1240" cy="46"  r="9"   fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <circle cx="1240" cy="46"  r="4"   fill="#06b6d4" opacity="0.95"/>

  <circle cx="1360" cy="210" r="9"   fill="#03060d"/>
  <circle cx="1360" cy="210" r="9"   fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <circle cx="1360" cy="210" r="4"   fill="#3b82f6" opacity="0.95"/>

  <circle cx="1060" cy="300" r="9"   fill="#03060d"/>
  <circle cx="1060" cy="300" r="9"   fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <circle cx="1060" cy="300" r="4"   fill="#06b6d4" opacity="0.95"/>

  <!-- MAIN node -->
  <circle cx="1180" cy="200" r="20"  fill="#03060d"/>
  <circle cx="1180" cy="200" r="20"  fill="none" stroke="url(#brand)" stroke-width="2.2"/>
  <circle cx="1180" cy="200" r="9"   fill="url(#brand)" opacity="0.95"/>
  <!-- Pulse -->
  <circle cx="1180" cy="200" r="20" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0">
    <animate attributeName="r"       values="20;36;20" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ── BOTTOM ACCENT BAR ── -->
  <rect x="0" y="389" width="1584" height="7" fill="url(#brand)" opacity="0.60"/>

</svg>
